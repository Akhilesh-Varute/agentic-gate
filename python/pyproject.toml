[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-gate"
version = "1.0.0"
description = "Deterministic schema validation gates and circuit breakers for LLM function calling"
readme = "README.md"
license = "MIT"
authors = [{ name = "Akhilesh Varute" }]
requires-python = ">=3.9"
keywords = ["llm", "agentic", "pydantic", "function-calling", "guardrails", "bedrock", "openai", "anthropic", "gemini"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]

[project.urls]
Homepage = "https://github.com/Akhilesh-Varute/agentic-gate"
Repository = "https://github.com/Akhilesh-Varute/agentic-gate"
Issues = "https://github.com/Akhilesh-Varute/agentic-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentic_gate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
